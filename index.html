<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q4 Drill 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

    <div class="container m-5 p-3 bg-dark text-light rounded-3 justify-content-center w-50 mx-auto">

        <h1 class="mb-4"><span class="text-danger fw-bolder">Heat </span>Index Checker<span class="fst-italic"> !</span></h1>

        <label for="TEMP" class="form-label">Enter Temperature in °C</label>
        <input type="number" id="TEMP" class="form-control rounded p-1 w-50" placeholder="type Temperature here...">
        <br>

        <label for="HUMID" class="form-label">Enter Humidity in %</label>
        <input type="number" id="HUMID" class="form-control rounded p-1 w-50" placeholder="type Humidity here...">
        <br>

        <button class="btn btn-danger mt-2 mb-4 w-25" onclick="checkHI()">Check Heat Index</button>
    </div>
    

    <script>
        function checkHI(){
            var temp = document.getElementById("TEMP").value;
            var humid = document.getElementById("HUMID").value;
            var HeatIndex = temp + (0.33 * humid) - 4;

            var status = "";

            switch (true){
                case (HeatIndex <= 27): 
                    status = "Comfortable / Cool";
                    break;

                case (HeatIndex <= 32): 
                    status = "Warm";
                    break;

                case (HeatIndex <= 37): 
                    status = "Hot";
                    break;

                case (HeatIndex <= 41): 
                    status = "Very Hot / Caution";
                    break;

                case (HeatIndex >= 42): 
                    status = "Extreme Heat / Danger";
                    break;

                default:
                    status = "Heat Index cannot be determined.";
            }

            alert("Heat Index: " + HeatIndex.toFixed(1) + " || " + "Status: " + status + "°C");

        }
    </script>
    
</body>
</html>
